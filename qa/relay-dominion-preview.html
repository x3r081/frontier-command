<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internal QA · Relay Dominion visual preview</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.45 system-ui, sans-serif; background: #10191b; color: #e8eee8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
    main { min-width: 0; min-height: 100vh; position: relative; background: #17282d; }
    canvas { display: block; width: 100%; height: 100vh; }
    aside { padding: 22px 18px; background: #111b1e; border-left: 1px solid #304348; }
    .flag { color: #ffca70; text-transform: uppercase; font-size: 11px; font-weight: 750; letter-spacing: .14em; }
    h1 { margin: 8px 0 4px; font-size: 19px; line-height: 1.2; }
    p { color: #aabbb9; margin: 8px 0 18px; }
    label { display: block; margin: 16px 0 6px; font-size: 12px; font-weight: 700; color: #d4dfdc; }
    select { width: 100%; border: 1px solid #456068; border-radius: 6px; padding: 9px 10px; background: #1c2b30; color: #f2f5ef; font: inherit; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 18px; color: #d4dfdc; }
    .check input { accent-color: #4dd5dd; }
    .status { border-top: 1px solid #304348; margin-top: 22px; padding-top: 14px; color: #95aaa8; font-size: 12px; }
    .status strong { color: #e8eee8; }
    #error { color: #ff9d8e; white-space: pre-wrap; }
    @media (max-width: 760px) {
      body { grid-template-columns: 1fr; grid-template-rows: minmax(60vh, 1fr) auto; }
      main { min-height: 60vh; }
      canvas { height: 60vh; }
      aside { border-left: 0; border-top: 1px solid #304348; }
    }
  </style>
</head>
<body>
  <main><canvas id="battlefield" aria-label="Relay Dominion renderer diagnostic preview"></canvas></main>
  <aside>
    <div class="flag">Internal QA · Diagnostic only</div>
    <h1>Relay Dominion preview</h1>
    <p>Real Game and Renderer3D scene centered on two secure relay sites. This page is separate from the game and menu.</p>

    <label for="owner">Dominion countdown owner</label>
    <select id="owner"><option value="player">Player · Aegis</option><option value="enemy">Enemy · Vesper</option></select>

    <label for="fog">Relay visibility</label>
    <select id="fog"><option value="2">Visible</option><option value="1">Explored fog</option><option value="0">Unexplored fog</option></select>

    <label class="check"><input id="contested" type="checkbox"> Contest central relay</label>

    <div class="status" id="status"><strong>Loading renderer…</strong></div>
    <div class="status" id="error" hidden></div>
  </aside>
  <script type="module" src="./relay-dominion-preview.js"></script>
</body>
</html>
